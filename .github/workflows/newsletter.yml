name: Weekly USMNT Abroad Newsletter

on:
  schedule:
    # Monday 12:00 UTC ≈ 8:00 AM ET / 7:00 AM EST
    - cron: '0 12 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (1 = do not send email)'
        required: true
        default: '0'
        type: string
      mock_data:
        description: 'Use mock data (1 = no real API calls)'
        required: true
        default: '0'
        type: string

jobs:
  newsletter:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run newsletter
        run: python -m src.run_newsletter
        env:
          PYTHONUNBUFFERED: 1
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          API_FOOTBALL_HOST: ${{ vars.API_FOOTBALL_HOST || 'v3.football.api-sports.io' }}
          API_FOOTBALL_BASE_URL: ${{ vars.API_FOOTBALL_BASE_URL || 'https://v3.football.api-sports.io' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          RESEND_TO: ${{ secrets.RESEND_TO }}
          DRY_RUN: ${{ github.event.inputs.dry_run || vars.DRY_RUN || '0' }}
          MOCK_DATA: ${{ github.event.inputs.mock_data || vars.MOCK_DATA || '0' }}
