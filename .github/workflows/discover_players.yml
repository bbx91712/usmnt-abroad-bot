name: Discover player clubs

on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m src.discover_players
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          DRY_RUN: 0
          MOCK_DATA: 0
