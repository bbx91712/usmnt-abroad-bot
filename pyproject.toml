[project]
name = "usmnt-abroad-bot"
version = "0.1.0"
description = "Weekly USMNT Abroad newsletter + live match Twitter bot"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
    "pytz>=2023.3",
    "resend>=0.6.0",
    "jinja2>=3.1.0",
    "tweepy>=4.14.0",
]

[project.scripts]
usmnt-newsletter = "src.run_newsletter:main"
usmnt-live = "src.run_live_tweets:main"
